  if (parcCheck) {
    parcCheck.addEventListener("change", () => document.getElementById("parcela-fields").classList.toggle("hidden", !parcCheck.checked));
  }

  document.getElementById("btn-save-lanc").addEventListener("click", () => saveManualEntry(prefill));
}

async function saveManualEntry(prefill) {
  const btn = document.getElementById("btn-save-lanc");
  btn.disabled = true;
  try {
    const tipo = document.querySelector("#tipo-toggle button.active").dataset.tipo;
    const valor = parseValorInput(document.getElementById("f-valor").value);
    const data = document.getElementById("f-data").value || todayISO();
    const macrocategoria = document.getElementById("f-macro").value;
    const microcategoria = document.getElementById("f-micro").value;
    const descricao = document.getElementById("f-desc").value.trim();
    const conta = document.getElementById("f-conta").value.trim();
    const meioPagamento = tipo === "despesa" ? (document.getElementById("f-meio-pagamento")?.value || "") : "";
    if (!valor || valor <= 0) { toast("Informe um valor válido."); btn.disabled = false; return; }

    if (state.editingId) {
      const updated = await apiUpdate("Lancamentos", state.editingId, { tipo, valor, data, macrocategoria, microcategoria, descricao, conta, meio_pagamento: meioPagamento });
      const idx = state.lancamentos.findIndex((l) => l.id === state.editingId);
      if (idx !== -1) state.lancamentos[idx] = updated;
      toast("Lançamento atualizado.");
      saveCache(); closeSheet(); renderCurrentTab();
      return;
    }

    const parcCheck = document.getElementById("f-parcelado");
    if (parcCheck && parcCheck.checked) {
      const numParcelas = Math.max(2, parseInt(document.getElementById("f-num-parcelas").value, 10) || 2);
      const parcelamento = await apiCreate("Parcelamentos", {
        descricao: descricao || (macrocategoria + " parcelado"), valor_total: valor, num_parcelas: numParcelas,
        data_primeira_parcela: data, macrocategoria,
      });
      const base = Math.floor((valor / numParcelas) * 100) / 100;
      const items = [];
      let acumulado = 0;
      for (let i = 0; i < numParcelas; i++) {
        const isLast = i === numParcelas - 1;
        const parcelaValor = isLast ? Math.round((valor - acumulado) * 100) / 100 : base;
        acumulado += parcelaValor;
        items.push({
          tipo, valor: parcelaValor, data: addMonthsISO(data, i),
          macrocategoria, microcategoria, descricao: `${descricao || macrocategoria} (parcela ${i+1}/${numParcelas})`,
          conta, meio_pagamento: meioPagamento, forma_entrada: "parcelado", parcelamento_id: parcelamento.id, comprovante_url: prefill?.comprovante_url || "",
        });
      }
      const created = await apiBulkCreate("Lancamentos", items);
      state.lancamentos = state.lancamentos.concat(created);
      state.parcelamentos = state.parcelamentos.concat([parcelamento]);
      toast(tipo === "receita" ? `Receita parcelada lançada em ${numParcelas}x.` : `Parcelamento lançado em ${numParcelas}x.`);
    } else {
      const created = await apiCreate("Lancamentos", {
        tipo, valor, data, macrocategoria, microcategoria, descricao, conta, meio_pagamento: meioPagamento,
        forma_entrada: prefill?.forma_entrada || "manual", comprovante_url: prefill?.comprovante_url || "",
      });
      state.lancamentos = state.lancamentos.concat([created]);
      toast("Lançamento salvo.");
    }
    saveCache();
    closeSheet();
    renderCurrentTab();
  } catch (err) {
    toast("Erro ao salvar: " + err.message);
  } finally {
    btn.disabled = false;
  }
}

/* ---------- IA: contexto e prompt ---------- */
function categoryContextText() {
  const groups = {};
  state.categorias.forEach((c) => { if (c.microcategoria) { (groups[c.macrocategoria] = groups[c.macrocategoria] || []).push(c.microcategoria); } });
  return Object.entries(groups).map(([macro, micros]) => `${macro}: ${micros.join(", ")}`).join("\n");
}
function aiSystemPrompt() {
  return `Você é um assistente que interpreta lançamentos financeiros pessoais em português do Brasil.
Categorias existentes (prefira uma delas; combine macro e micro coerentemente):
${categoryContextText()}
Data de hoje: ${todayISO()}
Responda APENAS com um objeto JSON, sem markdown e sem texto extra, no formato exato:
{"tipo":"despesa|receita","valor":numero,"macrocategoria":"...","microcategoria":"...","data":"AAAA-MM-DD","descricao":"texto curto","parcelado":true|false,"num_parcelas":numero,"meio_pagamento":"Pix|Cartão de Crédito|Desconto em Folha|","confianca":"alta|media|baixa"}
Se a data não for mencionada, use a data de hoje. "valor" deve ser apenas o número, sem símbolo de moeda.
Regras para lançamentos parcelados/fracionados, que valem tanto para despesas (compras parceladas) quanto para receitas (recebimentos fracionados em vários meses):
- Despesa parcelada, ex.: "comprei uma TV em 10 prestações de 250 reais", "parcelei em 5x de 100", "paguei em 3 vezes" → tipo="despesa", parcelado=true.
- Receita parcelada/fracionada, ex.: "vendi algo e vou receber 100 reais por mês nos próximos 10 meses", "vou receber esse valor em 5 parcelas", "recebimento fracionado em 4x" → tipo="receita", parcelado=true.
- "num_parcelas" deve ser a quantidade de parcelas/meses mencionada.
- "valor" deve ser sempre o valor TOTAL (soma de todas as parcelas), nunca o valor de uma parcela isolada. Se a pessoa falar o valor de cada parcela (ex.: "10 prestações de 250 reais" ou "100 reais por mês por 10 meses"), multiplique: valor = num_parcelas × valor_de_cada_parcela (nesses exemplos, valor = 2500 e 1000). Se a pessoa já falar o valor total (ex.: "parcelei uma compra de 2500 em 10x"), use esse total direto.
- Se não for parcelado/fracionado, "parcelado" deve ser false e "num_parcelas" deve ser 1.
Regra para "meio_pagamento" — só se aplica quando tipo="despesa":
- Use "Pix" se a pessoa mencionar pix.
- Use "Cartão de Crédito" se mencionar cartão de crédito, cartão, ou "no crédito".
- Use "Desconto em Folha" se mencionar desconto em folha, descontado do salário/contracheque.
- Se não for possível identificar, ou se tipo="receita", deixe "meio_pagamento" como string vazia "".`;
}
function parseAIJson(text) {
  try { return JSON.parse(text.trim()); } catch (e) {}
  const m = text.match(/\{[\s\S]*\}/);
  if (m) { try { return JSON.parse(m[0]); } catch (e) {} }
  throw new Error("Não entendi a resposta da IA.");
}

/* ---------- IA: OpenAI ---------- */
async function openaiChatJSON(systemPrompt, userContent) {
  const res = await fetch("https://api.openai.com/v1/chat/completions", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + state.config.aiApiKey },
    body: JSON.stringify({
      model: state.config.aiModelText || "gpt-4o-mini",
      messages: [{ role: "system", content: systemPrompt }, { role: "user", content: userContent }],
      response_format: { type: "json_object" },
      temperature: 0.2,
    }),
  });
  const json = await res.json();
  if (json.error) throw new Error(json.error.message);
  return parseAIJson(json.choices[0].message.content);
}
async function openaiTranscribe(blob) {
  const form = new FormData();
  form.append("file", blob, "audio.webm");
  form.append("model", state.config.aiModelAudio || "whisper-1");
  const res = await fetch("https://api.openai.com/v1/audio/transcriptions", {
    method: "POST", headers: { "Authorization": "Bearer " + state.config.aiApiKey }, body: form,
  });
  const json = await res.json();
  if (json.error) throw new Error(json.error.message);
  return json.text;
}

/* ---------- IA: Anthropic ---------- */
async function anthropicMessageJSON(systemPrompt, content) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": state.config.aiApiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: state.config.aiModelText || "claude-3-5-sonnet-20241022",
      max_tokens: 500,
      system: systemPrompt,
      messages: [{ role: "user", content }],
    }),
  });
  const json = await res.json();
  if (json.error) throw new Error(json.error.message);
  return parseAIJson(json.content[0].text);
}

/* ---------- fluxo: áudio ---------- */
function wireAudioMode() {
  document.getElementById("btn-record").addEventListener("click", startAudioCapture);
  document.getElementById("btn-stop").addEventListener("click", () => stopAudioCapture(false));
}
async function startAudioCapture() {
  document.getElementById("rec-indicator").classList.remove("hidden");
  document.getElementById("btn-record").classList.add("hidden");
  document.getElementById("btn-stop").classList.remove("hidden");

  if (state.config.aiProvider === "openai") {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      state.audioChunks = [];
      state.mediaRecorder = new MediaRecorder(stream);
      state.mediaRecorder.ondataavailable = (e) => state.audioChunks.push(e.data);
      state.mediaRecorder.start();
    } catch (err) {
      toast("Não consegui acessar o microfone: " + err.message);
      resetAudioButtons();
    }
    return;
  }

  // reconhecimento de voz do navegador (grátis) — Anthropic ou sem IA
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    toast("Seu navegador não suporta ditado por voz. Tente pelo Chrome no Android, ou use o modo Manual.");
    resetAudioButtons();
    return;
  }
  const rec = new SR();
  rec.lang = "pt-BR";
  rec.continuous = true;
  rec.interimResults = true;
  let finalTranscript = "";
  rec.onresult = (e) => {
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) finalTranscript += e.results[i][0].transcript;
      else interim += e.results[i][0].transcript;
    }
    document.getElementById("audio-transcript").textContent = finalTranscript + interim;
  };
  rec.onerror = () => {};
  rec.onend = () => { handleAudioTranscript(finalTranscript.trim()); };
  state.recognizer = rec;
  rec.start();
}
function resetAudioButtons() {
  document.getElementById("rec-indicator")?.classList.add("hidden");
  document.getElementById("btn-record")?.classList.remove("hidden");
  document.getElementById("btn-stop")?.classList.add("hidden");
}
async function stopAudioCapture(silent) {
  resetAudioButtons();
  if (state.mediaRecorder && state.mediaRecorder.state !== "inactive") {
    const recorder = state.mediaRecorder;
    const stopped = new Promise((resolve) => { recorder.onstop = resolve; });
    recorder.stop();
    recorder.stream.getTracks().forEach((t) => t.stop());
    await stopped;
    state.mediaRecorder = null;
    if (silent) return;
    const blob = new Blob(state.audioChunks, { type: "audio/webm" });
    if (blob.size < 500) return;
    await handleAudioBlob(blob);
  }
  if (state.recognizer) {
    try { state.recognizer.stop(); } catch (e) {}
    state.recognizer = null;
  }
}
async function handleAudioBlob(blob) {
  document.getElementById("audio-transcript").textContent = "Transcrevendo…";
  try {
    const transcript = await openaiTranscribe(blob);
    document.getElementById("audio-transcript").textContent = transcript;
    await handleAudioTranscript(transcript);
  } catch (err) {
    toast("Erro na transcrição: " + err.message);
  }
}
async function handleAudioTranscript(transcript) {
  if (!transcript) { toast("Não ouvi nada."); return; }
  if (state.config.aiProvider === "none" || !state.config.aiApiKey) {
    state.sheetMode = "manual";
    renderEntryBody({ tipo: "despesa", data: todayISO(), descricao: transcript, __aiNote: "Preenchido a partir do seu áudio (sem IA de categorização)." });
    return;
  }
  document.getElementById("audio-transcript").textContent = "Interpretando: " + transcript;
  try {
    let suggestion;
    if (state.config.aiProvider === "openai") suggestion = await openaiChatJSON(aiSystemPrompt(), transcript);
    else suggestion = await anthropicMessageJSON(aiSystemPrompt(), transcript);
    suggestion.__aiNote = "Sugestão da IA a partir do seu áudio.";
    state.sheetMode = "manual";
    renderEntryBody(suggestion);
  } catch (err) {
    toast("A IA não conseguiu interpretar: " + err.message);
  }
}

/* ---------- fluxo: foto ---------- */
function wireFotoMode() {
  document.getElementById("foto-input").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    document.getElementById("foto-status").textContent = "Processando imagem…";
    try {
      const thumbDataUrl = await resizeImageToDataURL(file, 480, 0.5);
      if (state.config.aiProvider === "none" || !state.config.aiApiKey) {
        state.sheetMode = "manual";
        renderEntryBody({ tipo: "despesa", data: todayISO(), comprovante_url: thumbDataUrl, __aiNote: "Foto anexada como comprovante (sem IA de leitura)." });
        return;
      }
      document.getElementById("foto-status").textContent = "Lendo nota fiscal…";
      const visionDataUrl = await resizeImageToDataURL(file, 1200, 0.8);
      const base64 = visionDataUrl.split(",")[1];
      let suggestion;
      if (state.config.aiProvider === "openai") {
        suggestion = await openaiChatJSON(aiSystemPrompt(), [
          { type: "text", text: "Leia esta nota fiscal e extraia o lançamento." },
          { type: "image_url", image_url: { url: visionDataUrl } },
        ]);
      } else {
        suggestion = await anthropicMessageJSON(aiSystemPrompt(), [
          { type: "image", source: { type: "base64", media_type: "image/jpeg", data: base64 } },
          { type: "text", text: "Leia esta nota fiscal e extraia o lançamento." },
        ]);
      }
      suggestion.comprovante_url = thumbDataUrl;
      suggestion.__aiNote = "Sugestão da IA a partir da foto da nota.";
      state.sheetMode = "manual";
      renderEntryBody(suggestion);
    } catch (err) {
      toast("Erro ao processar a foto: " + err.message);
      document.getElementById("foto-status").textContent = "";
    }
  });
}
function resizeImageToDataURL(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = () => { img.onload = () => {
      let { width, height } = img;
      if (width > height && width > maxDim) { height = Math.round(height * (maxDim / width)); width = maxDim; }
      else if (height > maxDim) { width = Math.round(width * (maxDim / height)); height = maxDim; }
      const canvas = document.createElement("canvas");
      canvas.width = width; canvas.height = height;
      canvas.getContext("2d").drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL("image/jpeg", quality));
    }; img.onerror = reject; img.src = reader.result; };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ---------- helpers ---------- */
function escapeHTML(str) {
  return String(str ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
