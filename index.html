<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Gestor Financeiro Pessoal</title>
<meta name="description" content="Controle pessoal de receitas, despesas e parcelamentos" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="theme-color" content="#047857" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Finanças" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
<style>
  :root {
    color-scheme: light;
    --surface-0: #f9f9f7;
    --surface-1: #fcfcfb;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --muted: #898781;
    --gridline: #e1e0d9;
    --baseline: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --series-1: #2a78d6; /* Alimentação */
    --series-2: #d63053; /* Saúde */
    --series-3: #00b2c2; /* Transporte/Automóvel */
    --series-4: #eda100; /* Moradia */
    --series-5: #e87ba4; /* Sítio */
    --series-6: #b740b1; /* Lazer/Festas */
    --series-7: #4a3aa7; /* Educação */
    --series-8: #915200; /* Outros */
    --good: #047857; /* entradas / marca — verde */
    --critical: #eb6834; /* saídas, dívidas — laranja vívido */
    --radius-lg: 18px;
    --radius-md: 12px;
    --radius-sm: 9px;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-0: #0d0d0d;
      --surface-1: #1a1a19;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --muted: #898781;
      --gridline: #2c2c2a;
      --baseline: #383835;
      --border: rgba(255,255,255,0.10);
      --series-1: #3987e5;
      --series-2: #b9003d;
      --series-3: #008f9f;
      --series-4: #c98500;
      --series-5: #d55181;
      --series-6: #9d2398;
      --series-7: #9085e9;
      --series-8: #a16100;
      --good: #059669;
      --critical: #d95926;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-0: #0d0d0d;
    --surface-1: #1a1a19;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --muted: #898781;
    --gridline: #2c2c2a;
    --baseline: #383835;
    --border: rgba(255,255,255,0.10);
    --series-1: #3987e5;
    --series-2: #b9003d;
    --series-3: #008f9f;
    --series-4: #c98500;
    --series-5: #d55181;
    --series-6: #9d2398;
    --series-7: #9085e9;
    --series-8: #a16100;
    --good: #059669;
    --critical: #d95926;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--surface-0);
    color: var(--text-primary);
    min-height: 100dvh;
    -webkit-tap-highlight-color: transparent;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100dvh;
    position: relative;
    padding-bottom: calc(84px + env(safe-area-inset-bottom));
  }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--surface-0);
    border-bottom: 1px solid var(--gridline);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .topbar h1 { font-size: 1.1rem; font-weight: 700; margin: 0; }
  #topbar-actions { display: flex; align-items: center; gap: 4px; }
  .topbar .month-nav { display: flex; align-items: center; gap: 8px; }
  .icon-btn {
    background: none; border: none; color: var(--text-primary);
    font-size: 1.2rem; cursor: pointer; padding: 6px 10px; border-radius: 999px;
    line-height: 1;
  }
  .icon-btn:active { background: var(--gridline); }

  main#view-root { padding: 14px 16px 8px; }

  .card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .card h2 { font-size: 0.95rem; font-weight: 600; margin: 0 0 10px; color: var(--text-primary); }
  .muted { color: var(--muted); font-size: 0.82rem; }
  .secondary { color: var(--text-secondary); }

  .stat-row { display: flex; gap: 10px; margin-bottom: 12px; }
  .stat-tile { flex: 1; background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px; }
  .stat-tile .label { font-size: 0.78rem; color: var(--text-secondary); margin-bottom: 4px; }
  .stat-tile .value { font-size: 1.3rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat-tile.hero .value { font-size: 1.7rem; }
  .value.positive { color: var(--good); }
  .value.negative { color: var(--critical); }

  .chart-wrap { position: relative; width: 100%; height: 220px; }
  .chart-wrap canvas { touch-action: manipulation; }
  .chart-wrap.donut { height: 240px; }
  .chart-wrap.wide { height: 230px; }
  .chart-scroll { overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; }

  .empty-state { text-align: center; padding: 28px 12px; color: var(--text-secondary); }
  .empty-state .big { font-size: 2rem; margin-bottom: 8px; }

  .list-item { display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid var(--gridline); gap: 10px; }
  .list-item:last-child { border-bottom: none; }
  .li-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .li-text { min-width: 0; }
  .li-text .cat { font-size: 0.92rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .li-text .sub { font-size: 0.76rem; color: var(--muted); }
  .li-right { text-align: right; flex: none; display: flex; align-items: center; gap: 8px; }
  .li-right .amount { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 0.94rem; }
  .li-actions { display: none; gap: 4px; }
  .list-item:hover .li-actions { display: flex; }
  .li-actions button { background: none; border: none; color: var(--muted); font-size: 0.95rem; cursor: pointer; padding: 4px; }

  .filters-row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  select, input[type="text"], input[type="number"], input[type="date"], input[type="password"], input[type="url"] {
    font-family: inherit;
    font-size: 0.95rem;
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--gridline);
    background: var(--surface-0);
    color: var(--text-primary);
    width: 100%;
  }
  label.field-label { display: block; font-size: 0.78rem; color: var(--text-secondary); margin: 10px 0 5px; }
  .field { margin-bottom: 2px; }

  .segmented { display: flex; background: var(--surface-0); border: 1px solid var(--gridline); border-radius: 999px; padding: 3px; }
  .segmented button {
    flex: 1; border: none; background: none; padding: 9px 6px; border-radius: 999px;
    font-size: 0.86rem; font-weight: 600; color: var(--text-secondary); cursor: pointer;
  }
  .segmented button.active { background: var(--good); color: #fff; }
  .segmented.type-toggle button.active.despesa { background: var(--critical); color: #fff; }
  .segmented.type-toggle button.active.receita { background: var(--good); color: #fff; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: none; border-radius: var(--radius-sm); padding: 11px 16px;
    font-size: 0.92rem; font-weight: 600; cursor: pointer; width: 100%;
  }
  .btn-primary { background: var(--good); color: #fff; }
  .btn-outline { background: none; border: 1px solid var(--gridline); color: var(--text-primary); }
  .btn-ghost { background: var(--surface-0); color: var(--text-secondary); }
  .btn[disabled] { opacity: 0.5; pointer-events: none; }

  .bottomnav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
    max-width: 480px; margin: 0 auto;
    background: var(--surface-1); border-top: 1px solid var(--gridline);
    display: flex; justify-content: space-around;
    padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
  }
  .nav-btn { background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--muted); font-size: 0.58rem; cursor: pointer; padding: 4px 1px; flex: 1; min-width: 0; }
  .nav-btn .ic { font-size: 1.4rem; }
  .nav-btn.active { color: var(--good); }

  .fab {
    position: fixed; right: max(20px, calc((100% - 480px)/2 + 20px)); bottom: calc(86px + env(safe-area-inset-bottom));
    width: 58px; height: 58px; border-radius: 50%; background: var(--good); color: #fff;
    border: none; font-size: 30px; line-height: 1; box-shadow: 0 4px 14px rgba(0,0,0,0.25); cursor: pointer; z-index: 26;
  }

  .sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 50; display: flex; align-items: flex-end; }
  .sheet-overlay.hidden { display: none; }
  .sheet { position: relative; width: 100%; max-height: 90vh; overflow-y: auto; background: var(--surface-1); border-radius: 20px 20px 0 0; padding: 16px 16px calc(28px + env(safe-area-inset-bottom)); max-width: 480px; margin: 0 auto; }
  .sheet-handle { width: 36px; height: 4px; background: var(--gridline); border-radius: 999px; margin: 0 auto 12px; }
  .sheet-close {
    position: absolute; top: 10px; right: 10px; width: 32px; height: 32px; border-radius: 50%;
    background: var(--surface-0); border: 1px solid var(--gridline); color: var(--text-primary);
    font-size: 1.1rem; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 1;
  }
  .sheet-close:active { background: var(--gridline); }
  .sheet-title { font-weight: 700; font-size: 1.05rem; margin-bottom: 12px; padding-right: 34px; }

  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--surface-0); border: 1px solid var(--gridline); font-size: 0.82rem; margin: 0 6px 6px 0; }
  .chip button { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 0.85rem; padding: 0; }
  .macro-group { margin-bottom: 14px; }
  .macro-group .macro-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .macro-group .macro-head .name { font-weight: 700; font-size: 0.92rem; display: flex; align-items: center; gap: 8px; }

  .banner { border-radius: var(--radius-md); padding: 12px 14px; font-size: 0.86rem; margin-bottom: 12px; }
  .banner.info { background: color-mix(in srgb, var(--good) 12%, var(--surface-1)); border: 1px solid var(--good); }
  .banner.warn { background: color-mix(in srgb, var(--series-4) 16%, var(--surface-1)); border: 1px solid var(--series-4); }

  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom)); background: var(--text-primary); color: var(--surface-1); padding: 10px 18px; border-radius: 999px; font-size: 0.85rem; z-index: 80; box-shadow: 0 4px 14px rgba(0,0,0,0.25); }
  .toast.hidden { display: none; }

  .rec-indicator { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 30px 0; }
  .rec-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--critical); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

  .legend-row { display: flex; flex-wrap: wrap; gap: 10px 14px; margin-top: 10px; font-size: 0.78rem; }
  .legend-row .item { display: flex; align-items: center; gap: 6px; color: var(--text-secondary); }
  .legend-row .sw { width: 9px; height: 9px; border-radius: 50%; }

  a { color: var(--good); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <header class="topbar" id="topbar">
    <h1 id="topbar-title">Painel</h1>
    <div id="topbar-actions"></div>
  </header>

  <main id="view-root"></main>

  <button class="fab" id="fab">+</button>

  <nav class="bottomnav">
    <button class="nav-btn active" data-tab="painel-mes"><span class="ic">🗓️</span>Mês</button>
    <button class="nav-btn" data-tab="painel-geral"><span class="ic">📈</span>Geral</button>
    <button class="nav-btn" data-tab="lancamentos"><span class="ic">📋</span>Lançamentos</button>
    <button class="nav-btn" data-tab="investimentos"><span class="ic">🏦</span>Investim.</button>
    <button class="nav-btn" data-tab="categorias"><span class="ic">🏷️</span>Categorias</button>
    <button class="nav-btn" data-tab="ajustes"><span class="ic">⚙️</span>Ajustes</button>
  </nav>
</div>

<div class="sheet-overlay hidden" id="sheet-overlay">
  <div class="sheet" id="sheet">
    <button class="sheet-close" id="sheet-close-btn" title="Fechar" aria-label="Fechar">✕</button>
    <div class="sheet-handle"></div>
    <div id="sheet-content"></div>
  </div>
</div>

<div class="toast hidden" id="toast"></div>

<script>
/* =========================================================
   Gestor Financeiro Pessoal — app.js
   Vanilla JS, sem build step. Único backend: Google Apps
   Script (Code.gs) publicado como Web App sobre uma planilha
   Google que funciona como banco de dados.
   ========================================================= */

const LS_CONFIG = "gf_config_v1";
const LS_CACHE = "gf_cache_v1";

const MACRO_COLOR_ORDER = [
  "Alimentação", "Saúde", "Transporte/Automóvel", "Moradia",
  "Sítio", "Lazer/Festas", "Educação", "Outros"
];

function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}
function macroColor(macro) {
  if (macro === "Receita") return cssVar("--good"); // mesma cor do "Receitas" no gráfico
  const idx = MACRO_COLOR_ORDER.indexOf(macro);
  const slot = idx === -1 ? 8 : idx + 1;
  return cssVar("--series-" + slot);
}
const MEIO_PAGAMENTO_OPTS = ["Pix", "Cartão de Crédito", "Desconto em Folha"];
function meioPagamentoColor(meio) {
  if (meio === "Pix") return cssVar("--series-1");
  if (meio === "Cartão de Crédito") return cssVar("--series-4");
  if (meio === "Desconto em Folha") return cssVar("--series-7");
  return cssVar("--muted"); // não informado
}
// Escolhe texto branco ou escuro por cima de uma cor de preenchimento, pela luminância (WCAG).
function textColorForFill_(hex) {
  const h = (hex || "").replace("#", "");
  if (h.length !== 6) return "#ffffff";
  const r = parseInt(h.substring(0, 2), 16) / 255;
  const g = parseInt(h.substring(2, 4), 16) / 255;
  const b = parseInt(h.substring(4, 6), 16) / 255;
  const lin = (v) => (v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4));
  const L = 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
  return L > 0.55 ? "#1a1a19" : "#ffffff";
}
function hexToRgba(hex, alpha) {
  const h = (hex || "").replace("#", "");
  if (h.length !== 6) return hex;
  const r = parseInt(h.substring(0, 2), 16);
  const g = parseInt(h.substring(2, 4), 16);
  const b = parseInt(h.substring(4, 6), 16);
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

/* ---------- estado ---------- */
const state = {
  config: loadConfig(),
  lancamentos: [],
  categorias: [],
  parcelamentos: [],
  investimentos: [],
  movimentacoes: [],
  loaded: false,
  loading: false,
  lastError: null,
  currentTab: "painel-mes",
  dashboardMonth: currentMonthKey(),
  painelView: "mes",
  geralPeriodType: "trimestre",
  geralYear: currentYear(),
  geralQuarter: currentQuarter(),
  investPeriodType: "trimestre",
  investYear: currentYear(),
  investQuarter: currentQuarter(),
  investMonth: currentMonthKey(),
  filter: { mode: "mes", month: currentMonthKey(), year: currentYear(), macro: "" },
  charts: {},
  sheetMode: "manual",
  editingId: null,
  editingMovId: null,
  mediaRecorder: null,
  audioChunks: [],
  recognizer: null,
};

/* ---------- config / storage ---------- */
function loadConfig() {
  try {
    return Object.assign({
      sheetsUrl: "https://script.google.com/macros/s/AKfycbxNHaHuXE51tV2OYbSnG-quMMnLzOraR76w8ccovRhLo8nXd5sS5vUB6dsNMYIUx1bO/exec",
      aiProvider: "none",
      aiApiKey: "",
      aiModelText: "gpt-4o-mini",
      aiModelVision: "gpt-4o-mini",
      aiModelAudio: "whisper-1",
    }, JSON.parse(localStorage.getItem(LS_CONFIG) || "{}"));
  } catch (e) { return { sheetsUrl: "", aiProvider: "none", aiApiKey: "", aiModelText: "gpt-4o-mini", aiModelVision: "gpt-4o-mini", aiModelAudio: "whisper-1" }; }
}
function saveConfig() {
  localStorage.setItem(LS_CONFIG, JSON.stringify(state.config));
}
function loadCache() {
  try { return JSON.parse(localStorage.getItem(LS_CACHE) || "null"); } catch (e) { return null; }
}
function saveCache() {
  try {
    localStorage.setItem(LS_CACHE, JSON.stringify({
      lancamentos: state.lancamentos, categorias: state.categorias, parcelamentos: state.parcelamentos,
      investimentos: state.investimentos, movimentacoes: state.movimentacoes
    }));
  } catch (e) { /* quota — ignora */ }
}

/* ---------- utils de data/valor ---------- */
function todayISO() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function currentMonthKey() { return todayISO().slice(0,7); }
function currentYear() { return new Date().getFullYear(); }
function currentQuarter() { return Math.ceil((new Date().getMonth()+1)/3); }
function quarterMonths(q) { const start = (q-1)*3+1; return [start, start+1, start+2]; }
function quarterLabel(year, q) { return `${q}º trimestre de ${year}`; }
function shiftQuarter(year, q, n) {
  let idx = year*4 + (q-1) + n;
  const newYear = Math.floor(idx/4);
  let newQ = idx % 4;
  if (newQ < 0) newQ += 4;
  return { year: newYear, quarter: newQ+1 };
}
function periodoMonthKeys() {
  if (state.geralPeriodType === "ano") {
    return Array.from({length:12}, (_,i) => `${state.geralYear}-${String(i+1).padStart(2,"0")}`);
  }
  return quarterMonths(state.geralQuarter).map((m) => `${state.geralYear}-${String(m).padStart(2,"0")}`);
}
// período (mês/trimestre/ano) usado no card "Evolução do patrimônio" da aba Investimentos —
// independente do filtro de Painel Geral, com seu próprio estado (investPeriodType/Year/Quarter/Month).
function investPeriodMonthKeys() {
  if (state.investPeriodType === "mes") return [state.investMonth];
  if (state.investPeriodType === "ano") {
    return Array.from({length:12}, (_,i) => `${state.investYear}-${String(i+1).padStart(2,"0")}`);
  }
  return quarterMonths(state.investQuarter).map((m) => `${state.investYear}-${String(m).padStart(2,"0")}`);
}
function investPeriodLabel() {
  if (state.investPeriodType === "mes") return monthLabel(state.investMonth);
  if (state.investPeriodType === "ano") return String(state.investYear);
  return quarterLabel(state.investYear, state.investQuarter);
}
function shiftInvestPeriod(n) {
  if (state.investPeriodType === "mes") { state.investMonth = shiftMonthKey(state.investMonth, n); return; }
  if (state.investPeriodType === "ano") { state.investYear += n; return; }
  const s = shiftQuarter(state.investYear, state.investQuarter, n);
  state.investYear = s.year; state.investQuarter = s.quarter;
}
function investGranularidadeLabel() {
  if (state.investPeriodType === "mes") return "mês";
  if (state.investPeriodType === "trimestre") return "trimestre";
  return "ano";
}
// janela de períodos (mesma granularidade do filtro atual) terminando no período
// selecionado, pra sempre dar pra comparar com os anteriores — mês x mês passado,
// trimestre x trimestre passado, ano x ano passado — em vez de mostrar só 1 barra.
function investTrailingPeriods() {
  const periods = [];
  if (state.investPeriodType === "mes") {
    for (let i = 5; i >= 0; i--) {
      const mk = shiftMonthKey(state.investMonth, -i);
      periods.push({ end: mk, monthKeys: [mk], shortLabel: monthLabel(mk).slice(0, 3) + "/" + mk.slice(2, 4), label: monthLabel(mk) });
    }
  } else if (state.investPeriodType === "trimestre") {
    for (let i = 5; i >= 0; i--) {
      const s = shiftQuarter(state.investYear, state.investQuarter, -i);
      const mks = quarterMonths(s.quarter).map((m) => `${s.year}-${String(m).padStart(2, "0")}`);
      periods.push({ end: mks[mks.length - 1], monthKeys: mks, shortLabel: `${s.quarter}ºT/${String(s.year).slice(2)}`, label: quarterLabel(s.year, s.quarter) });
    }
  } else {
    for (let i = 4; i >= 0; i--) {
      const y = state.investYear - i;
      const mks = Array.from({ length: 12 }, (_, idx) => `${y}-${String(idx + 1).padStart(2, "0")}`);
      periods.push({ end: mks[mks.length - 1], monthKeys: mks, shortLabel: String(y), label: String(y) });
    }
  }
  return periods;
}
// mesmo período, um ano ou um trimestre antes do que está selecionado agora
// (pra comparação: ano atual x ano anterior, trimestre atual x trimestre anterior).
function periodoAnteriorInfo() {
  if (state.geralPeriodType === "ano") {
    const prevYear = state.geralYear - 1;
    return {
      keys: Array.from({length:12}, (_,i) => `${prevYear}-${String(i+1).padStart(2,"0")}`),
      label: String(prevYear),
    };
  }
  const s = shiftQuarter(state.geralYear, state.geralQuarter, -1);
  return {
    keys: quarterMonths(s.quarter).map((m) => `${s.year}-${String(m).padStart(2,"0")}`),
    label: quarterShortLabel(s.year, s.quarter),
  };
}
function quarterShortLabel(year, q) { return `${q}ºT/${String(year).slice(2)}`; }
function lancamentosNoPeriodoGeral() {
  const keys = new Set(periodoMonthKeys());
  return state.lancamentos.filter((l) => keys.has(monthKey(l.data)));
}
function monthKey(dateStr) { return (dateStr || "").slice(0,7); }
function parseISODate(dateStr) {
  const [y,m,d] = (dateStr || todayISO()).split("-").map(Number);
  return new Date(y, (m||1)-1, d||1);
}
function toISODate(d) {
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function addMonthsISO(dateStr, n) {
  const d = parseISODate(dateStr);
  const day = d.getDate();
  d.setDate(1);
  d.setMonth(d.getMonth() + n);
  const daysInMonth = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  d.setDate(Math.min(day, daysInMonth));
  return toISODate(d);
}
function monthLabel(key) {
  const [y,m] = key.split("-").map(Number);
  const d = new Date(y, m-1, 1);
  const label = d.toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
  return label.charAt(0).toUpperCase() + label.slice(1);
}
function shiftMonthKey(key, n) {
  const [y,m] = key.split("-").map(Number);
  const d = new Date(y, m-1+n, 1);
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
}
function last6MonthKeys(baseKey) {
  const keys = [];
  for (let i = 5; i >= 0; i--) keys.push(shiftMonthKey(baseKey, -i));
  return keys;
}
function next6MonthKeys(baseKey) {
  const keys = [];
  for (let i = 0; i < 6; i++) keys.push(shiftMonthKey(baseKey, i));
  return keys;
}
function formatBRL(v) {
  const n = Number(v) || 0;
  return n.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}
function parseValorInput(str) {
  if (typeof str === "number") return str;
  let s = String(str || "0").trim();
  s = s.replace(/[^\d,.-]/g, "");
  if (s.includes(",") && s.includes(".")) {
    s = s.replace(/\./g, "").replace(",", ".");
  } else if (s.includes(",")) {
    s = s.replace(",", ".");
  }
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}
function shortDate(dateStr) {
  const d = parseISODate(dateStr);
  return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "short" });
}
function uid() {
  return "id-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,8);
}

/* ---------- toast ---------- */
let toastTimer = null;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.remove("hidden");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add("hidden"), 2600);
}

/* ---------- API (Google Apps Script) ---------- */
function apiUrl() { return (state.config.sheetsUrl || "").trim(); }
async function apiGet(params) {
  const url = apiUrl();
  if (!url) throw new Error("Configure a URL do Apps Script em Ajustes.");
  const qs = new URLSearchParams(params).toString();
  const res = await fetch(url + (url.includes("?") ? "&" : "?") + qs, { method: "GET" });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || "Erro na planilha.");
  return json.data;
}
async function apiPost(body) {
  const url = apiUrl();
  if (!url) throw new Error("Configure a URL do Apps Script em Ajustes.");
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(body),
  });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || "Erro na planilha.");
  return json.data;
}
async function apiListAll() { return apiGet({ action: "listall" }); }
async function apiBootstrap() { return apiGet({ action: "bootstrap" }); }
async function apiCreate(sheet, data) { return apiPost({ action: "create", sheet, data }); }
async function apiBulkCreate(sheet, items) { return apiPost({ action: "bulkcreate", sheet, items }); }
async function apiUpdate(sheet, id, data) { return apiPost({ action: "update", sheet, id, data }); }
async function apiDelete(sheet, id) { return apiPost({ action: "delete", sheet, id }); }

async function refreshData(showToast) {
  if (!apiUrl()) return;
  state.loading = true;
  renderCurrentTab();
  try {
    const data = await apiListAll();
    state.lancamentos = data.Lancamentos || [];
    state.categorias = data.Categorias || [];
    state.parcelamentos = data.Parcelamentos || [];
    state.investimentos = data.Investimentos || [];
    state.movimentacoes = data.Movimentacoes || [];
    state.loaded = true;
    state.lastError = null;
    saveCache();
    if (showToast) toast("Dados atualizados.");
  } catch (err) {
    state.lastError = String(err.message || err);
    toast("Não consegui atualizar: " + state.lastError);
  } finally {
    state.loading = false;
    renderCurrentTab();
  }
}

function renderPainel(root, actions) {
  const isGeral = state.painelView === "geral";

  actions.innerHTML = `
    <button class="icon-btn" id="btn-refresh" title="Atualizar">⟳</button>
    <div class="month-nav">
      <button class="icon-btn" id="dash-prev">‹</button>
      <span class="secondary" id="dash-month-label" style="font-size:0.85rem; min-width:118px; text-align:center;"></span>
      <button class="icon-btn" id="dash-next">›</button>
    </div>`;
  document.getElementById("btn-refresh").onclick = () => refreshData(true);
  document.getElementById("dash-month-label").textContent = isGeral
    ? (state.geralPeriodType === "ano" ? String(state.geralYear) : quarterLabel(state.geralYear, state.geralQuarter).replace("trimestre de ", "trim. "))
    : monthLabel(state.dashboardMonth);
  document.getElementById("dash-prev").onclick = () => {
    if (isGeral) {
      if (state.geralPeriodType === "ano") state.geralYear -= 1;
      else { const s = shiftQuarter(state.geralYear, state.geralQuarter, -1); state.geralYear = s.year; state.geralQuarter = s.quarter; }
    } else {
      state.dashboardMonth = shiftMonthKey(state.dashboardMonth, -1);
    }
    renderPainel(root, actions);
  };
  document.getElementById("dash-next").onclick = () => {
    if (isGeral) {
      if (state.geralPeriodType === "ano") state.geralYear += 1;
      else { const s = shiftQuarter(state.geralYear, state.geralQuarter, 1); state.geralYear = s.year; state.geralQuarter = s.quarter; }
    } else {
      state.dashboardMonth = shiftMonthKey(state.dashboardMonth, 1);
    }
    renderPainel(root, actions);
  };

  if (isGeral) {
    renderPainelGeral(root);
  } else {
    renderPainelMes(root);
  }
}

/* mostra, numa folha, todas as parcelas futuras em aberto — com edição e exclusão,
   acionado ao tocar no card "Dívida futura em aberto" do Painel Mês. */
function showParcelasAbertas() {
  const parcelasAbertas = state.lancamentos.filter((l) => l.forma_entrada === "parcelado" && l.tipo === "despesa" && l.data >= todayISO());
  const dividaFutura = sum(parcelasAbertas);
  const list = parcelasAbertas.slice().sort((a, b) => (a.data || "").localeCompare(b.data || ""));
  document.getElementById("sheet-content").innerHTML = `
    <div class="sheet-title">Dívida futura em aberto</div>
    <div class="muted" style="margin-bottom:10px;">${list.length} parcela${list.length===1?"":"s"} · total ${formatBRL(dividaFutura)}</div>
    ${list.length ? renderList(list, true) : `<div class="empty-state"><div class="big">📭</div>Nenhuma parcela em aberto.</div>`}
  `;
  document.getElementById("sheet-overlay").classList.remove("hidden");
  wireParcelasAbertasActions(document.getElementById("sheet-content"));
}

/* como wireListActions, mas — por rodar dentro da folha de "Dívida futura" — também
   atualiza a própria lista da folha depois de excluir, em vez de só re-renderizar
   o painel atrás dela (senão o item excluído continuava aparecendo na folha aberta). */
function wireParcelasAbertasActions(container) {
  container.querySelectorAll('[data-act="edit"]').forEach((btn) => {
    btn.addEventListener("click", (e) => {
      const id = e.target.closest(".list-item").dataset.id;
      const item = state.lancamentos.find((l) => l.id === id);
      if (item) openSheet("manual", item);
    });
  });
  container.querySelectorAll('[data-act="del"]').forEach((btn) => {
    btn.addEventListener("click", async (e) => {
      const id = e.target.closest(".list-item").dataset.id;
      const item = state.lancamentos.find((l) => l.id === id);
      if (!confirm("Excluir esta parcela?")) return;
      try {
        await apiDelete("Lancamentos", id);
        state.lancamentos = state.lancamentos.filter((l) => l.id !== id);

        let extraCount = 0;
        if (item && item.forma_entrada === "parcelado" && item.parcelamento_id) {
          const futuras = state.lancamentos.filter((l) => l.parcelamento_id === item.parcelamento_id && l.data > item.data);
          if (futuras.length && confirm(`Essa era uma parcela de compra parcelada. Excluir também as ${futuras.length} parcela${futuras.length===1?"":"s"} futura${futuras.length===1?"":"s"} dessa mesma compra?`)) {
            for (const l of futuras) await apiDelete("Lancamentos", l.id);
            const futIds = new Set(futuras.map((l) => l.id));
            state.lancamentos = state.lancamentos.filter((l) => !futIds.has(l.id));
            extraCount = futuras.length;
          }
        }

        saveCache();
        toast(extraCount ? `${1 + extraCount} parcelas excluídas.` : "Parcela excluída.");
        renderCurrentTab();
        showParcelasAbertas();
      } catch (err) { toast("Erro ao excluir: " + err.message); }
    });
  });
}

        <div class="chart-scroll"><div class="chart-wrap wide" id="chart-catcomp-receita-wrap"><canvas id="chart-catcomp-receita"></canvas></div></div>
      ` : `<div class="empty-state"><div class="big">📊</div>Sem receitas suficientes para comparar com ${escapeHTML(anterior.label)}.</div>`}
    </div>

    <div class="card">
      <h2>Despesas por forma de pagamento — ${escapeHTML(periodoLabel)}</h2>
      ${despesas > 0
        ? `<div class="chart-wrap"><canvas id="chart-meiopag"></canvas></div>`
        : `<div class="empty-state"><div class="big">💳</div>Sem despesas neste período.</div>`}
    </div>
  `;
  root.querySelectorAll("#geral-period-toggle button").forEach((b) => {
    b.addEventListener("click", () => { state.geralPeriodType = b.dataset.period; renderCurrentTab(); });
  });
  drawReceitasDespesasChart(periodoMonthKeys());
  if (despesas > 0) { const periodKeysSet = new Set(periodoMonthKeys()); drawCategoriaChart(periodo.filter((l) => l.tipo === "despesa"), periodoLabel, (l) => periodKeysSet.has(monthKey(l.data))); }
  if (despesas > 0 || prevDespesas > 0) drawCategoriaComparativoChart("despesa", periodoMonthKeys(), anterior.keys, periodoLabelCurto, anterior.label, "chart-catcomp", "catcomp");
  if (receitas > 0 || prevReceitas > 0) drawCategoriaComparativoChart("receita", periodoMonthKeys(), anterior.keys, periodoLabelCurto, anterior.label, "chart-catcomp-receita", "catcompReceita");
  if (despesas > 0) {
    const periodKeysSet2 = new Set(periodoMonthKeys());
    drawValorPorChaveBarChart(periodo.filter((l) => l.tipo === "despesa"), periodoLabel, (l) => periodKeysSet2.has(monthKey(l.data)), {
      canvasId: "chart-meiopag", chartKey: "meiopag", keyFn: (l) => l.meio_pagamento, colorFn: meioPagamentoColor, emptyLabel: "Não informado",
    });
  }
}

function sum(list) { return list.reduce((acc, l) => acc + (Number(l.valor) || 0), 0); }
function byDataDesc(a, b) { return (b.data || "").localeCompare(a.data || "") || (b.criado_em||"").localeCompare(a.criado_em||""); }

function destroyChart(key) {
  if (state.charts[key]) { state.charts[key].destroy(); delete state.charts[key]; }
}
function baseChartFont() {
  return { family: "system-ui, -apple-system, sans-serif", size: 11 };
}
function drawReceitasDespesasChart(keys) {
  destroyChart("rd");
  const receitas = keys.map((k) => sum(state.lancamentos.filter((l) => monthKey(l.data) === k && l.tipo === "receita")));
  const despesas = keys.map((k) => sum(state.lancamentos.filter((l) => monthKey(l.data) === k && l.tipo === "despesa")));
  const ctx = document.getElementById("chart-rd");
  if (!ctx) return;

  // desenha o % que a despesa representa sobre a receita do mesmo mês, acima da barra de despesas
  const pctSobreReceitaPlugin = {
    id: "pctSobreReceita",
    afterDatasetsDraw(chart) {
      const meta = chart.getDatasetMeta(1); // dataset "Despesas"
      if (!meta || meta.hidden) return;
      const c = chart.ctx;
      c.save();
      c.font = "600 10px system-ui, -apple-system, sans-serif";
      c.fillStyle = cssVar("--critical");
      c.textAlign = "center";
      meta.data.forEach((bar, i) => {
        const rec = receitas[i], desp = despesas[i];
        if (!desp || rec <= 0) return;
        const pct = Math.round((desp / rec) * 100);
        c.fillText(pct + "%", bar.x, bar.y - 6);
      });
      c.restore();
    },
  };

  state.charts.rd = new Chart(ctx, {
    type: "bar",
    data: {
      labels: keys.map((k) => monthLabel(k).slice(0,3)),
      datasets: [
        { label: "Receitas", data: receitas, backgroundColor: cssVar("--good"), borderRadius: 4, maxBarThickness: 22 },
        { label: "Despesas", data: despesas, backgroundColor: cssVar("--critical"), borderRadius: 4, maxBarThickness: 22 },
      ],
    },
    options: Object.assign({}, chartBaseOptions({ legend: true }), {
      layout: { padding: { top: 16 } },
      onClick: (evt, _els, chart) => {
        const points = chart.getElementsAtEventForMode(evt, "nearest", { intersect: true }, true);
        if (!points.length) return;
        const { datasetIndex, index } = points[0];
        showLancamentosDoMes(keys[index], datasetIndex === 0 ? "receita" : "despesa");
      },
      onHover: (evt, els, chart) => { chart.canvas.style.cursor = els.length ? "pointer" : "default"; },
    }),
    plugins: [pctSobreReceitaPlugin],
  });
}

/* mostra, numa folha (bottom sheet), a lista de lançamentos de um tipo num mês —
   acionado ao tocar numa barra do gráfico Receitas x despesas. */
function showLancamentosDoMes(mk, tipo) {
  const list = state.lancamentos.filter((l) => monthKey(l.data) === mk && l.tipo === tipo).slice().sort(byDataDesc);
  const total = sum(list);
  const titulo = (tipo === "receita" ? "Receitas" : "Despesas") + " — " + monthLabel(mk);
  document.getElementById("sheet-content").innerHTML = `
    <div class="sheet-title">${escapeHTML(titulo)}</div>
    <div class="muted" style="margin-bottom:10px;">${list.length} lançamento${list.length===1?"":"s"} · total ${formatBRL(total)}</div>
    ${list.length ? renderList(list, false) : `<div class="empty-state"><div class="big">📭</div>Nenhum lançamento.</div>`}
    <button class="btn btn-outline" id="btn-ver-lancamentos" style="margin-top:14px;">Ver em Lançamentos</button>
  `;
  document.getElementById("sheet-overlay").classList.remove("hidden");
  document.getElementById("btn-ver-lancamentos").addEventListener("click", () => {
    state.filter.month = mk;
    state.filter.macro = "";
    closeSheet();
    switchTab("lancamentos");
  });
}

/* mostra, numa folha, uma lista de lançamentos filtrada a partir do estado atual
   (por categoria, por período, etc.) — acionado ao dar dois toques/cliques numa
   fatia ou barra dos gráficos de categoria/comparativo/parcelas. Com editar e
   excluir; como roda dentro de uma folha "por cima" de um gráfico já desenhado,
   depois de excluir ela re-renderiza a aba de trás (pro gráfico atualizar) E a
   si mesma (recalculando o filtro do zero, pro item excluído sumir da lista). */
function showLancamentosGenerico(filterFn, titulo) {
  const list = state.lancamentos.filter(filterFn).slice().sort(byDataDesc);
  const total = sum(list);
  document.getElementById("sheet-content").innerHTML = `
    <div class="sheet-title">${escapeHTML(titulo)}</div>
    <div class="muted" style="margin-bottom:10px;">${list.length} lançamento${list.length===1?"":"s"} · total ${formatBRL(total)}</div>
    ${list.length ? renderList(list, true) : `<div class="empty-state"><div class="big">📭</div>Nenhum lançamento.</div>`}
  `;
  document.getElementById("sheet-overlay").classList.remove("hidden");
  wireGenericoListActions(filterFn, titulo);
}
function wireGenericoListActions(filterFn, titulo) {
  const container = document.getElementById("sheet-content");
  container.querySelectorAll('[data-act="edit"]').forEach((btn) => {
    btn.addEventListener("click", (e) => {
      const id = e.target.closest(".list-item").dataset.id;
      const item = state.lancamentos.find((l) => l.id === id);
      if (item) openSheet("manual", item);
    });
  });
  container.querySelectorAll('[data-act="del"]').forEach((btn) => {
    btn.addEventListener("click", async (e) => {
      const id = e.target.closest(".list-item").dataset.id;
      const item = state.lancamentos.find((l) => l.id === id);
      if (!confirm("Excluir este lançamento?")) return;
      try {
        await apiDelete("Lancamentos", id);
        state.lancamentos = state.lancamentos.filter((l) => l.id !== id);

        let extraCount = 0;
        if (item && item.forma_entrada === "parcelado" && item.parcelamento_id) {
          const futuras = state.lancamentos.filter((l) => l.parcelamento_id === item.parcelamento_id && l.data > item.data);
          if (futuras.length && confirm(`Essa era uma parcela de compra parcelada. Excluir também as ${futuras.length} parcela${futuras.length===1?"":"s"} futura${futuras.length===1?"":"s"} dessa mesma compra?`)) {
            for (const l of futuras) await apiDelete("Lancamentos", l.id);
            const futIds = new Set(futuras.map((l) => l.id));
            state.lancamentos = state.lancamentos.filter((l) => !futIds.has(l.id));
            extraCount = futuras.length;
          }
        }

        saveCache();
        toast(extraCount ? `${1 + extraCount} parcelas excluídas.` : "Lançamento excluído.");
        renderCurrentTab();
        showLancamentosGenerico(filterFn, titulo);
      } catch (err) { toast("Erro ao excluir: " + err.message); }
    });
  });
}
function pointerCursorOnHover(evt, els, chart) { chart.canvas.style.cursor = els.length ? "pointer" : "default"; }

function drawCategoriaChart(despesasList, periodLabel, periodMatchFn, opts) {
  opts = opts || {};
  const canvasId = opts.canvasId || "chart-cat";
  const chartKey = opts.chartKey || "cat";
  const keyFn = opts.keyFn || ((l) => l.macrocategoria);
  const colorFn = opts.colorFn || macroColor;
  const emptyLabel = opts.emptyLabel || "—";
  destroyChart(chartKey);
  const byMacro = {};
  despesasList.forEach((l) => { const k = keyFn(l) || emptyLabel; byMacro[k] = (byMacro[k] || 0) + Number(l.valor || 0); });
  const entries = Object.entries(byMacro).sort((a,b) => b[1]-a[1]);
  const total = entries.reduce((s, e) => s + e[1], 0);
  const colors = entries.map((e) => colorFn(e[0]));
  const ctx = document.getElementById(canvasId);
  if (!ctx) return;

  // Desenha o % de cada fatia sobre o próprio gráfico — só nas fatias grandes o
  // bastante pra caber o texto sem virar bagunça; as menores ficam com o % na
  // legenda (abaixo) e no tooltip ao tocar.
  const donutPctPlugin = {
    id: "donutPct",
    afterDatasetsDraw(chart) {
      const meta = chart.getDatasetMeta(0);
      if (!meta || meta.hidden || !total) return;
      const c = chart.ctx;
      c.save();
      c.font = "700 11px system-ui, -apple-system, sans-serif";
      c.textAlign = "center";
      c.textBaseline = "middle";
      meta.data.forEach((arc, i) => {
        if (chart.getDataVisibility && !chart.getDataVisibility(i)) return;
        const value = entries[i][1];
        const pct = value / total;
        if (pct < 0.06) return;
        const angle = (arc.startAngle + arc.endAngle) / 2;
        const radius = (arc.innerRadius + arc.outerRadius) / 2;
        const x = arc.x + Math.cos(angle) * radius;
        const y = arc.y + Math.sin(angle) * radius;
        c.fillStyle = textColorForFill_(colors[i]);
        c.fillText(Math.round(pct * 100) + "%", x, y);
      });
      c.restore();
    },
  };

  state.charts[chartKey] = new Chart(ctx, {
    type: "doughnut",
    data: {
      labels: entries.map((e) => e[0]),
      datasets: [{ data: entries.map((e) => e[1]), backgroundColor: colors, borderColor: cssVar("--surface-1"), borderWidth: 2 }],
    },
    options: {
      cutout: "62%",
      plugins: {
        legend: {
          position: "bottom",
          labels: {
            color: cssVar("--text-secondary"), font: baseChartFont(), boxWidth: 9, boxHeight: 9, padding: 12,
            generateLabels: () => entries.map((e, i) => ({
              text: `${e[0]} — ${total ? Math.round((e[1] / total) * 100) : 0}%`,
              fillStyle: colors[i], strokeStyle: colors[i], index: i,
            })),
          },
          onClick: (evt, item, legend) => {
            legend.chart.toggleDataVisibility(item.index);
            legend.chart.update();
          },
        },
        tooltip: tooltipStyle((c) => {
          const pct = total ? Math.round((c.raw / total) * 100) : 0;
          return `${formatBRL(c.raw)} (${pct}%)`;
        }),
      },
      maintainAspectRatio: false,
      onHover: pointerCursorOnHover,
    },
    plugins: [donutPctPlugin],
  });
  state.charts[chartKey].canvas.addEventListener("dblclick", (evt) => {
    const points = state.charts[chartKey].getElementsAtEventForMode(evt, "nearest", { intersect: true }, true);
    if (!points.length) return;
    const key = entries[points[0].index][0];
    const filterFn = (l) => l.tipo === "despesa" && (keyFn(l) || emptyLabel) === key && (!periodMatchFn || periodMatchFn(l));
    showLancamentosGenerico(filterFn, `${key} — ${periodLabel || ""}`.trim());
  });
}

/* Gráfico de barras com o valor em R$ (não %) por chave (ex.: forma de pagamento).
   keyFn extrai a chave de cada lançamento; colorFn escolhe a cor de cada barra. */
function drawValorPorChaveBarChart(despesasList, periodLabel, periodMatchFn, opts) {
  opts = opts || {};
  const canvasId = opts.canvasId;
  const chartKey = opts.chartKey;
  const keyFn = opts.keyFn;
  const colorFn = opts.colorFn;
  const emptyLabel = opts.emptyLabel || "—";
  destroyChart(chartKey);
  const byKey = {};
  despesasList.forEach((l) => { const k = keyFn(l) || emptyLabel; byKey[k] = (byKey[k] || 0) + Number(l.valor || 0); });
  const entries = Object.entries(byKey).sort((a, b) => b[1] - a[1]);
  const ctx = document.getElementById(canvasId);
  if (!ctx || !entries.length) return;
  const colors = entries.map((e) => colorFn(e[0]));

  // desenha o valor em R$ em cima de cada barra
  const valuePlugin = {
    id: "valorBarLabel" + chartKey,
    afterDatasetsDraw(chart) {
      const meta = chart.getDatasetMeta(0);
      if (!meta) return;
      const c = chart.ctx;
      c.save();
      c.font = "700 11px system-ui, -apple-system, sans-serif";
      c.textAlign = "center";
      c.fillStyle = cssVar("--text-primary");
      meta.data.forEach((bar, i) => {
        if (chart.getDataVisibility && !chart.getDataVisibility(i)) return;
        c.fillText(formatBRL(entries[i][1]), bar.x, bar.y - 8);
      });
      c.restore();
    },
  };

  const chartOpts = chartBaseOptions({ legend: false });
  chartOpts.layout = { padding: { top: 22 } };
  chartOpts.scales.x.ticks.autoSkip = false;
  chartOpts.onHover = pointerCursorOnHover;
  chartOpts.plugins.tooltip = tooltipStyle((c) => formatBRL(c.raw));

  state.charts[chartKey] = new Chart(ctx, {
    type: "bar",
    data: {
      labels: entries.map((e) => e[0]),
      datasets: [{ data: entries.map((e) => e[1]), backgroundColor: colors, borderRadius: 4, maxBarThickness: 46 }],
    },
    options: chartOpts,
    plugins: [valuePlugin],
  });
  state.charts[chartKey].canvas.addEventListener("dblclick", (evt) => {
    const points = state.charts[chartKey].getElementsAtEventForMode(evt, "nearest", { intersect: true }, true);
    if (!points.length) return;
    const key = entries[points[0].index][0];
    const filterFn = (l) => l.tipo === "despesa" && (keyFn(l) || emptyLabel) === key && (!periodMatchFn || periodMatchFn(l));
    showLancamentosGenerico(filterFn, `${key} — ${periodLabel || ""}`.trim());
  });
}

/* Comparativo por categoria: período atual x período anterior (mês x mês, trimestre
   x trimestre, ou ano x ano), uma barra dupla por categoria, ordenado da maior
   despesa (no período atual) pra menor, com uma setinha + % de variação desenhada
   acima de cada par de barras. Rola pro lado quando tem categoria demais pra caber
   na tela. curKeys/prevKeys: string "AAAA-MM" ou array delas (trimestre/ano). */
function drawCategoriaComparativoChart(tipo, curKeys, prevKeys, curLabel, prevLabel, canvasId, chartKey) {
  chartKey = chartKey || "catcomp";
  canvasId = canvasId || "chart-catcomp";
  destroyChart(chartKey);
  const isReceita = tipo === "receita";
  const curSet = new Set(Array.isArray(curKeys) ? curKeys : [curKeys]);
  const prevSet = new Set(Array.isArray(prevKeys) ? prevKeys : [prevKeys]);
  const curByMacro = {}, prevByMacro = {};
  state.lancamentos.forEach((l) => {
    if (l.tipo !== tipo) return;
    const lk = monthKey(l.data);
    if (curSet.has(lk)) curByMacro[l.macrocategoria] = (curByMacro[l.macrocategoria] || 0) + Number(l.valor || 0);
    else if (prevSet.has(lk)) prevByMacro[l.macrocategoria] = (prevByMacro[l.macrocategoria] || 0) + Number(l.valor || 0);
  });
  const allMacros = new Set([...Object.keys(curByMacro), ...Object.keys(prevByMacro)]);
  const rows = Array.from(allMacros)
    .map((m) => ({ macro: m, prev: prevByMacro[m] || 0, cur: curByMacro[m] || 0 }))
    .filter((r) => r.prev > 0 || r.cur > 0)
    .sort((a, b) => b.cur - a.cur || b.prev - a.prev);

  const ctx = document.getElementById(canvasId);
  if (!ctx || !rows.length) return;

  const wrapEl = document.getElementById(canvasId + "-wrap");
  if (wrapEl) wrapEl.style.width = Math.max(rows.length * 82, 340) + "px";

  // para despesas, a cor "principal" é a crítica (laranja) e subir é ruim;
  // para receitas, a cor principal é a "good" (verde) e subir é bom — a lógica
  // de cor do delta (▲/▼) se inverte de acordo.
  const mainColor = cssVar(isReceita ? "--good" : "--critical");
  const prevColor = hexToRgba(mainColor, 0.35);
  const curColor = mainColor;
  const goodColor = cssVar("--good");
  const criticalColor = cssVar("--critical");
  const increaseColor = isReceita ? goodColor : criticalColor;
  const decreaseColor = isReceita ? criticalColor : goodColor;

  const deltaPlugin = {
    id: "catcompDelta" + chartKey,
    afterDatasetsDraw(chart) {
      const metaPrev = chart.getDatasetMeta(0);
      const metaCur = chart.getDatasetMeta(1);
      if (!metaCur || metaCur.hidden) return;
      const c = chart.ctx;
      c.save();
      c.font = "700 10px system-ui, -apple-system, sans-serif";
      c.textAlign = "center";
      rows.forEach((r, i) => {
        const barCur = metaCur.data[i];
        const barPrev = metaPrev.data[i];
        if (!barCur) return;
        let text, color;
        if (r.prev === 0 && r.cur > 0) { text = "novo"; color = increaseColor; }
        else if (r.prev > 0 && r.cur === 0) { text = "▼100%"; color = decreaseColor; }
        else {
          const pct = Math.round(((r.cur - r.prev) / r.prev) * 100);
          if (pct === 0) { text = "="; color = cssVar("--muted"); }
          else { text = (pct > 0 ? "▲" : "▼") + Math.abs(pct) + "%"; color = pct > 0 ? increaseColor : decreaseColor; }
        }
        const topY = Math.min(barCur.y, barPrev ? barPrev.y : barCur.y) - 6;
        c.fillStyle = color;
        c.fillText(text, barCur.x, topY);
      });
      c.restore();
    },
  };

  const opts = chartBaseOptions({ legend: false });
  opts.layout = { padding: { top: 22 } };
  opts.scales.x.ticks.autoSkip = false;
  opts.scales.x.ticks.maxRotation = 45;
  opts.scales.x.ticks.minRotation = 0;
  opts.onHover = pointerCursorOnHover;

  state.charts[chartKey] = new Chart(ctx, {
    type: "bar",
    data: {
      labels: rows.map((r) => r.macro),
      datasets: [
        { label: prevLabel, data: rows.map((r) => r.prev), backgroundColor: prevColor, borderRadius: 4, maxBarThickness: 20 },
        { label: curLabel, data: rows.map((r) => r.cur), backgroundColor: curColor, borderRadius: 4, maxBarThickness: 20 },
      ],
    },
    options: opts,
    plugins: [deltaPlugin],
  });
  state.charts[chartKey].canvas.addEventListener("dblclick", (evt) => {
    const points = state.charts[chartKey].getElementsAtEventForMode(evt, "nearest", { intersect: true }, true);
    if (!points.length) return;
    const { datasetIndex, index } = points[0];
    const row = rows[index];
    if (!row) return;
    const isPrev = datasetIndex === 0;
    const periodSet = isPrev ? prevSet : curSet;
    const periodLbl = isPrev ? prevLabel : curLabel;
    const macro = row.macro;
    const filterFn = (l) => l.tipo === tipo && l.macrocategoria === macro && periodSet.has(monthKey(l.data));
    showLancamentosGenerico(filterFn, `${macro} — ${periodLbl}`);
  });
}
function drawParcelasChart(mk) {
  destroyChart("parc");
  const keys = next6MonthKeys(mk);
  const vals = keys.map((k) => sum(state.lancamentos.filter((l) => monthKey(l.data) === k && l.forma_entrada === "parcelado" && l.tipo === "despesa")));
  const ctx = document.getElementById("chart-parc");
  if (!ctx) return;
  const opts = chartBaseOptions({ legend: false });
  opts.onHover = pointerCursorOnHover;
  state.charts.parc = new Chart(ctx, {
    type: "bar",
    data: { labels: keys.map((k) => monthLabel(k).slice(0,3)), datasets: [{ label: "Parcelas", data: vals, backgroundColor: cssVar("--critical"), borderRadius: 4, maxBarThickness: 26 }] },
    options: opts,
  });
  state.charts.parc.canvas.addEventListener("dblclick", (evt) => {
    const points = state.charts.parc.getElementsAtEventForMode(evt, "nearest", { intersect: true }, true);
    if (!points.length) return;
    const mkSel = keys[points[0].index];
    const filterFn = (l) => l.forma_entrada === "parcelado" && l.tipo === "despesa" && monthKey(l.data) === mkSel;
    showLancamentosGenerico(filterFn, `Parcelas — ${monthLabel(mkSel)}`);
  });
}
function tooltipStyle(labelFn) {
  return {
    backgroundColor: cssVar("--surface-1"), titleColor: cssVar("--text-primary"), bodyColor: cssVar("--text-secondary"),
    borderColor: cssVar("--gridline"), borderWidth: 1, padding: 10, cornerRadius: 8, displayColors: false,
    callbacks: labelFn ? { label: labelFn } : undefined,
  };
}
function chartBaseOptions({ legend }) {
  return {
    maintainAspectRatio: false,
    plugins: {
      legend: legend ? { position: "top", align: "end", labels: { color: cssVar("--text-secondary"), font: baseChartFont(), boxWidth: 9, boxHeight: 9, usePointStyle: true } } : { display: false },
      tooltip: tooltipStyle((c) => c.dataset.label + ": " + formatBRL(c.raw)),
    },
    scales: {
      x: { grid: { display: false }, border: { color: cssVar("--baseline") }, ticks: { color: cssVar("--text-secondary"), font: baseChartFont() } },
      y: { grid: { color: cssVar("--gridline") }, border: { display: false }, ticks: { color: cssVar("--muted"), font: baseChartFont(), callback: (v) => formatBRL(v).replace(",00","") } },
    },
  };
}

/* ---------- LANÇAMENTOS (lista) ---------- */
function renderLancamentos(root, actions) {
  actions.innerHTML = `<button class="icon-btn" id="btn-refresh" title="Atualizar">⟳</button>`;
  document.getElementById("btn-refresh").onclick = () => refreshData(true);
  const macros = distinctMacros();
  const mode = state.filter.mode === "ano" ? "ano" : "mes";
  root.innerHTML = `
    <div class="segmented" id="periodo-mode-toggle" style="margin-bottom:10px;">
      <button data-mode="mes" class="${mode==="mes"?"active":""}">Mês</button>
      <button data-mode="ano" class="${mode==="ano"?"active":""}">Ano</button>
    </div>
    <div class="filters-row">
      ${mode === "ano"
        ? `<select id="f-year" style="flex:1;">${yearOptions(state.filter.year)}</select>`
        : `<select id="f-month" style="flex:1;">${last18MonthOptions(state.filter.month)}</select>`}
      <select id="f-macro" style="flex:1;"><option value="">Todas categorias</option>${macros.map((m) => `<option value="${escapeHTML(m)}" ${state.filter.macro===m?"selected":""}>${escapeHTML(m)}</option>`).join("")}</select>
    </div>
    <div class="card">
      <div id="lanc-resumo" class="muted" style="margin-bottom:8px;"></div>
      <div id="lanc-list"></div>
    </div>
  `;
  document.querySelectorAll("#periodo-mode-toggle button").forEach((b) => {
    b.addEventListener("click", () => { state.filter.mode = b.dataset.mode; renderLancamentos(root, actions); });
  });
  if (mode === "ano") {
    document.getElementById("f-year").onchange = (e) => { state.filter.year = Number(e.target.value); renderLancamentos(root, actions); };
  } else {
    document.getElementById("f-month").onchange = (e) => { state.filter.month = e.target.value; renderLancamentos(root, actions); };
  }
  document.getElementById("f-macro").onchange = (e) => { state.filter.macro = e.target.value; renderLancamentos(root, actions); };

  let list = mode === "ano"
    ? state.lancamentos.filter((l) => (l.data || "").slice(0,4) === String(state.filter.year))
    : state.lancamentos.filter((l) => !state.filter.month || monthKey(l.data) === state.filter.month);
  if (state.filter.macro) list = list.filter((l) => l.macrocategoria === state.filter.macro);
  list = list.slice().sort(byDataDesc);

  const totalReceitas = sum(list.filter((l) => l.tipo === "receita"));
  const totalDespesas = sum(list.filter((l) => l.tipo === "despesa"));
  document.getElementById("lanc-resumo").textContent = list.length
    ? `${list.length} lançamento${list.length===1?"":"s"} · Receitas ${formatBRL(totalReceitas)} · Despesas ${formatBRL(totalDespesas)}`
    : "";
  document.getElementById("lanc-list").innerHTML = list.length ? renderList(list, true) : `<div class="empty-state"><div class="big">📭</div>Nenhum lançamento neste filtro.</div>`;
  wireListActions(root);
}
function last18MonthOptions(selected) {
  const now = currentMonthKey();
  let out = "";
  for (let i = -2; i <= 15; i++) {
    const k = shiftMonthKey(now, -i);
    out += `<option value="${k}" ${k===selected?"selected":""}>${monthLabel(k)}</option>`;
  }
  return out;
}
function yearOptions(selected) {
  const now = currentYear();
  let out = "";
  for (let y = now + 1; y >= now - 5; y--) {
    out += `<option value="${y}" ${y===selected?"selected":""}>${y}</option>`;
  }
  return out;
}
function distinctMacros() {
  const set = new Set();
  state.categorias.forEach((c) => c.macrocategoria && set.add(c.macrocategoria));
  return Array.from(set);
}
function tipoColor(tipo) {
  // verde para entrada (receita), laranja para saída (despesa) — mesmo laranja já usado em "Despesas"
  return tipo === "receita" ? cssVar("--series-3") : cssVar("--critical");
}
function renderList(list, withActions) {
  return list.map((l) => `
    <div class="list-item" data-id="${escapeHTML(l.id)}">
      <div class="li-left">
        <span class="dot" style="background:${tipoColor(l.tipo)}"></span>
        <div class="li-text">
          <div class="cat">${escapeHTML(l.microcategoria || l.macrocategoria || "—")}</div>
          <div class="sub">${escapeHTML(l.macrocategoria||"")} · ${shortDate(l.data)}${l.forma_entrada==="parcelado" ? " · parcela" : ""}${l.descricao ? " · " + escapeHTML(l.descricao) : ""}</div>
        </div>
      </div>
      <div class="li-right">
        <span class="amount ${l.tipo==="receita" ? "positive" : "negative"}">${l.tipo==="receita"?"+":"−"} ${formatBRL(l.valor)}</span>
        ${withActions ? `<span class="li-actions" style="display:flex;"><button data-act="edit" title="Editar">✎</button><button data-act="del" title="Excluir">🗑</button></span>` : ""}
      </div>
    </div>`).join("");
}
function wireListActions(root) {
  root.querySelectorAll('[data-act="edit"]').forEach((btn) => {
    btn.addEventListener("click", (e) => {
      const id = e.target.closest(".list-item").dataset.id;
      const item = state.lancamentos.find((l) => l.id === id);
      if (item) openSheet("manual", item);
    });
  });
  root.querySelectorAll('[data-act="del"]').forEach((btn) => {
    btn.addEventListener("click", async (e) => {
      const id = e.target.closest(".list-item").dataset.id;
      const item = state.lancamentos.find((l) => l.id === id);
      if (!confirm("Excluir este lançamento?")) return;
      try {
        await apiDelete("Lancamentos", id);
        state.lancamentos = state.lancamentos.filter((l) => l.id !== id);

        let extraCount = 0;
        if (item && item.forma_entrada === "parcelado" && item.parcelamento_id) {
          const futuras = state.lancamentos.filter((l) => l.parcelamento_id === item.parcelamento_id && l.data > item.data);
          if (futuras.length && confirm(`Essa era uma parcela de compra parcelada. Excluir também as ${futuras.length} parcela${futuras.length===1?"":"s"} futura${futuras.length===1?"":"s"} dessa mesma compra?`)) {
            for (const l of futuras) await apiDelete("Lancamentos", l.id);
            const futIds = new Set(futuras.map((l) => l.id));
            state.lancamentos = state.lancamentos.filter((l) => !futIds.has(l.id));
            extraCount = futuras.length;
          }
        }

        saveCache();
        toast(extraCount ? `${1 + extraCount} parcelas excluídas.` : "Lançamento excluído.");
        renderCurrentTab();
      } catch (err) { toast("Erro ao excluir: " + err.message); }
    });
  });
}

  root.querySelectorAll('[data-act="edit-saldo"]').forEach((btn) => {

async function addContaInvestimento() {
  const banco = prompt("Nome do banco/instituição:");
  if (!banco) return;
  const saldoStr = prompt("Saldo atual (R$):", "0,00");
  if (saldoStr === null) return;
  const saldo = parseValorInput(saldoStr);
  try {
    const created = await apiCreate("Investimentos", { banco, saldo, observacao: "" });
    state.investimentos = state.investimentos.concat([created]);
    saveCache();
    toast("Conta cadastrada.");
    renderCurrentTab();
  } catch (err) { toast("Erro ao cadastrar: " + err.message); }
}

async function editarSaldoConta(conta) {
  const saldoStr = prompt(`Novo saldo de "${conta.banco}" (R$):`, String(conta.saldo || 0).replace(".", ","));
  if (saldoStr === null) return;
  const saldo = parseValorInput(saldoStr);
  try {
    const updated = await apiUpdate("Investimentos", conta.id, { saldo, atualizado_em: new Date().toISOString() });
    const idx = state.investimentos.findIndex((c) => c.id === conta.id);
    if (idx !== -1) state.investimentos[idx] = updated;
    saveCache();
    toast("Saldo atualizado.");
    renderCurrentTab();
  } catch (err) { toast("Erro ao atualizar: " + err.message); }
}

/* ---------- MOVIMENTAÇÕES (aporte / retirada / rendimento / transferência) ---------- */
function contaNome(id) {
  const c = state.investimentos.find((x) => x.id === id);
  return c ? (c.banco || "—") : "—";
}
function movTipoLabel(tipo) {
  return { aporte: "Aporte", retirada: "Retirada", rendimento: "Rendimento", transferencia: "Transferência" }[tipo] || tipo;
}
function movTipoColor(tipo) {
  if (tipo === "aporte") return cssVar("--good");
  if (tipo === "rendimento") return cssVar("--series-1");
  if (tipo === "retirada") return cssVar("--critical");
  return cssVar("--series-7"); // transferência
}
// efeito de cada tipo de movimentação sobre o saldo: sinal aplicado ao valor,
// na conta de origem (conta_id) e, só no caso de transferência, na de destino.
function saldoEfeito(tipo) {
  if (tipo === "aporte" || tipo === "rendimento") return { origem: 1, destino: 0 };
  if (tipo === "retirada") return { origem: -1, destino: 0 };
  if (tipo === "transferencia") return { origem: -1, destino: 1 };
  return { origem: 0, destino: 0 };
}
async function ajustarSaldoConta_(contaId, delta) {
  if (!contaId || !delta) return;
  const idx = state.investimentos.findIndex((c) => c.id === contaId);
  if (idx === -1) return;
  const novoSaldo = (Number(state.investimentos[idx].saldo) || 0) + delta;
  const updated = await apiUpdate("Investimentos", contaId, { saldo: novoSaldo, atualizado_em: new Date().toISOString() });
  state.investimentos[idx] = updated;
}
async function applyMovimentoSaldo(mov) {
  const efeito = saldoEfeito(mov.tipo);
  await ajustarSaldoConta_(mov.conta_id, efeito.origem * mov.valor);
  if (mov.conta_destino_id) await ajustarSaldoConta_(mov.conta_destino_id, efeito.destino * mov.valor);
}
async function reverseMovimentoSaldo(mov) {
  const efeito = saldoEfeito(mov.tipo);
  await ajustarSaldoConta_(mov.conta_id, -efeito.origem * mov.valor);
  if (mov.conta_destino_id) await ajustarSaldoConta_(mov.conta_destino_id, -efeito.destino * mov.valor);
}
// Aporte é sobra do mês indo pra dentro da conta — dinheiro que já apareceu como
// receita antes, então não deve contar de novo. Rendimento é ganho novo (juros/lucro),
// então além de mexer no saldo da conta ele também deve valer como receita nos
// indicadores de Painel Mês/Geral — por isso mantemos um lançamento de receita
// "grudado" nele (via lancamento_id), criado/atualizado/apagado junto.
// `mov` é o estado NOVO (após a edição); `oldMov` é o estado anterior (ou null se é criação).
// Retorna o lancamento_id que deve ser salvo na movimentação.
async function syncLancamentoRendimento(mov, oldMov) {
  const eraRendimento = oldMov && oldMov.tipo === "rendimento";
  const eRendimento = mov.tipo === "rendimento";
  const lancIdAnterior = oldMov && oldMov.lancamento_id;

  if (!eRendimento) {
    if (eraRendimento && lancIdAnterior) {
      try {
        await apiDelete("Lancamentos", lancIdAnterior);
        state.lancamentos = state.lancamentos.filter((l) => l.id !== lancIdAnterior);
      } catch (err) { /* se já não existir mais, ignora */ }
    }
    return "";
  }

  const payload = {
    tipo: "receita", valor: mov.valor, data: mov.data, macrocategoria: "Receita", microcategoria: "Juros",
    descricao: mov.descricao || `Rendimento — ${contaNome(mov.conta_id)}`, conta: contaNome(mov.conta_id), forma_entrada: "manual",
  };
  if (eraRendimento && lancIdAnterior) {
    const updated = await apiUpdate("Lancamentos", lancIdAnterior, payload);
    const idx = state.lancamentos.findIndex((l) => l.id === lancIdAnterior);
    if (idx !== -1) state.lancamentos[idx] = updated; else state.lancamentos = state.lancamentos.concat([updated]);
    return lancIdAnterior;
  }
  const created = await apiCreate("Lancamentos", payload);
  state.lancamentos = state.lancamentos.concat([created]);
  return created.id;
}
// soma aporte/retirada/rendimento por mês (chaves em invKeys); transferência entre
// contas próprias não entra aqui porque não muda o patrimônio total, só a distribuição.
function movimentacoesPorTipoEMes(keys) {
  const byMonth = {};
  keys.forEach((k) => { byMonth[k] = { aporte: 0, retirada: 0, rendimento: 0 }; });
  state.movimentacoes.forEach((m) => {
    const k = monthKey(m.data);
    if (!byMonth[k]) return;
    if (m.tipo === "aporte") byMonth[k].aporte += Number(m.valor) || 0;
    else if (m.tipo === "retirada") byMonth[k].retirada += Number(m.valor) || 0;
    else if (m.tipo === "rendimento") byMonth[k].rendimento += Number(m.valor) || 0;
  });
  return byMonth;
}
// mesma soma, mas agrupada por PERÍODO (que pode abranger vários meses, no caso de
// trimestre/ano) em vez de por mês isolado — usada nos gráficos de comparação da
// aba Investimentos, que agora mostram uma janela de vários períodos seguidos.
function movimentacoesPorTipoEPeriodo(periods) {
  return periods.map((p) => {
    const keys = new Set(p.monthKeys);
    let aporte = 0, retirada = 0, rendimento = 0;
    state.movimentacoes.forEach((m) => {
      if (!keys.has(monthKey(m.data))) return;
      if (m.tipo === "aporte") aporte += Number(m.valor) || 0;
      else if (m.tipo === "retirada") retirada += Number(m.valor) || 0;
      else if (m.tipo === "rendimento") rendimento += Number(m.valor) || 0;
    });
    return { aporte, retirada, rendimento };
  });
}
// efeito líquido de uma movimentação sobre o PATRIMÔNIO TOTAL (soma de todas as
// contas): aporte/rendimento aumentam, retirada diminui, transferência entre
// contas próprias não muda o total (só remaneja entre contas).
function efeitoMovimentoNoTotal(m) {
  if (m.tipo === "aporte" || m.tipo === "rendimento") return Number(m.valor) || 0;
  if (m.tipo === "retirada") return -(Number(m.valor) || 0);
  return 0;
}
// reconstrói o patrimônio total estimado ao FINAL de cada período da janela,
// partindo do total ATUAL (saldo somado de todas as contas, agora) e "desfazendo"
// o efeito de toda movimentação posterior ao fim de cada período. Não usa um
// histórico de saldo por conta (que não existe) — por isso uma edição manual de
// saldo (✎), que não passa pela régua de movimentações, não entra nessa
// reconstrução; é a melhor aproximação possível sem manter um livro-razão completo.
function investPatrimonioPorPeriodo(periods, totalAtual) {
  return periods.map((p) => {
    const efeitoPosterior = state.movimentacoes.reduce((acc, m) => (
      monthKey(m.data) > p.end ? acc + efeitoMovimentoNoTotal(m) : acc
    ), 0);
    return totalAtual - efeitoPosterior;
  });
}

/* mostra, numa folha, uma lista de movimentações filtrada — usada ao tocar nas barras
   dos gráficos de evolução/aportes x rendimentos. */
function showMovimentacoesGenerico(filterFn, titulo) {
  const list = state.movimentacoes.filter(filterFn).slice().sort(byDataDesc);
  document.getElementById("sheet-content").innerHTML = `
    <div class="sheet-title">${escapeHTML(titulo)}</div>
    <div class="muted" style="margin-bottom:10px;">${list.length} movimentaç${list.length === 1 ? "ão" : "ões"}</div>
    ${list.length ? renderMovList(list, true) : `<div class="empty-state"><div class="big">📭</div>Nenhuma movimentação.</div>`}
  `;
  document.getElementById("sheet-overlay").classList.remove("hidden");
  wireMovimentacoesListActions(filterFn, titulo, { inSheet: true });
}
// with `inSheet: true`, também refaz a listagem dentro da própria folha depois de excluir
// (como wireGenericoListActions); com `rerenderTab: true` (uso na própria aba Investimentos),
// só re-renderiza a aba de trás.
function wireMovimentacoesListActions(filterFn, titulo, opts) {
  opts = opts || {};
  const container = opts.inSheet ? document.getElementById("sheet-content") : document.getElementById("view-root");
  container.querySelectorAll('[data-act="edit-mov"]').forEach((btn) => {
    btn.addEventListener("click", (e) => {
      const id = e.target.closest(".list-item").dataset.id;
      const item = state.movimentacoes.find((m) => m.id === id);
      if (item) openMovSheet(item);
    });
  });
  container.querySelectorAll('[data-act="del-mov"]').forEach((btn) => {
    btn.addEventListener("click", async (e) => {
      const id = e.target.closest(".list-item").dataset.id;
      const item = state.movimentacoes.find((m) => m.id === id);
      if (!item) return;
      if (!confirm("Excluir esta movimentação? O saldo da conta volta ao que era antes dela.")) return;
      try {
        await reverseMovimentoSaldo(item);
        if (item.tipo === "rendimento" && item.lancamento_id) {
          try {
            await apiDelete("Lancamentos", item.lancamento_id);
            state.lancamentos = state.lancamentos.filter((l) => l.id !== item.lancamento_id);
          } catch (err) { /* se já não existir mais, ignora */ }
        }
        await apiDelete("Movimentacoes", id);
        state.movimentacoes = state.movimentacoes.filter((m) => m.id !== id);
        saveCache();
        toast("Movimentação excluída.");
        renderCurrentTab();
        if (opts.inSheet) showMovimentacoesGenerico(filterFn, titulo);
      } catch (err) { toast("Erro ao excluir: " + err.message); }
    });
  });
}

function wireMovForm(prefill) {
  if (!state.investimentos.length) return;
  const tipoSel = document.getElementById("mov-tipo");
  const contaLabel = document.getElementById("mov-conta-label");
  const destinoField = document.getElementById("mov-conta-destino-field");
  function applyTipoUI() {
    const t = tipoSel.value;
    destinoField.classList.toggle("hidden", t !== "transferencia");
    contaLabel.textContent = t === "transferencia" ? "Conta de origem" : (t === "retirada" ? "Sai de" : "Conta");
  }
  tipoSel.addEventListener("change", applyTipoUI);
  applyTipoUI();
  document.getElementById("btn-save-mov").addEventListener("click", () => saveMovimentacao(prefill));
}
async function saveMovimentacao(prefill) {
  const btn = document.getElementById("btn-save-mov");
  if (!btn) return;
  btn.disabled = true;
  try {
    const tipo = document.getElementById("mov-tipo").value;
    const contaId = document.getElementById("mov-conta").value;
    const contaDestinoId = tipo === "transferencia" ? document.getElementById("mov-conta-destino").value : "";
    const valor = parseValorInput(document.getElementById("mov-valor").value);
    const data = document.getElementById("mov-data").value || todayISO();
    const descricao = document.getElementById("mov-desc").value.trim();

    if (!valor || valor <= 0) { toast("Informe um valor válido."); btn.disabled = false; return; }
    if (tipo === "transferencia" && (!contaDestinoId || contaDestinoId === contaId)) {
      toast("Escolha duas contas diferentes para a transferência."); btn.disabled = false; return;
    }

    if (state.editingMovId) {
      const old = state.movimentacoes.find((m) => m.id === state.editingMovId);
      if (old) await reverseMovimentoSaldo(old);
      const novo = { tipo, conta_id: contaId, conta_destino_id: contaDestinoId, valor, data, descricao };
      await applyMovimentoSaldo(novo);
      const lancamentoId = await syncLancamentoRendimento(novo, old);
      const updated = await apiUpdate("Movimentacoes", state.editingMovId, { data, conta_id: contaId, tipo, valor, conta_destino_id: contaDestinoId, descricao, lancamento_id: lancamentoId });
      const idx = state.movimentacoes.findIndex((m) => m.id === state.editingMovId);
      if (idx !== -1) state.movimentacoes[idx] = updated;
      toast("Movimentação atualizada.");
    } else {
      const lancamentoId = await syncLancamentoRendimento({ tipo, conta_id: contaId, valor, data, descricao }, null);
      const created = await apiCreate("Movimentacoes", { data, conta_id: contaId, tipo, valor, conta_destino_id: contaDestinoId, descricao, lancamento_id: lancamentoId });
      state.movimentacoes = state.movimentacoes.concat([created]);
      await applyMovimentoSaldo(created);
      toast(tipo === "rendimento" ? "Movimentação lançada — também contou como receita do mês." : "Movimentação lançada.");
    }
    saveCache();
    closeSheet();
    renderCurrentTab();
  } catch (err) {
    toast("Erro ao salvar: " + err.message);
  } finally {
    if (btn) btn.disabled = false;
  }
}

// gráfico 1: patrimônio total estimado ao final de cada período da janela — mostra
// a tendência (subindo/descendo) e permite comparar visualmente o período
// selecionado (última barra) com os anteriores. Barra fica verde se o patrimônio
// subiu em relação à barra anterior, laranja se caiu, neutra na primeira (sem
// período anterior na janela pra comparar).
function drawPatrimonioTotalChart(periods, series) {
  destroyChart("invPatrimonio");
  const ctx = document.getElementById("chart-inv-patrimonio");
  if (!ctx) return;
  const colors = series.map((v, i) => {
    if (i === 0) return cssVar("--muted");
    return v >= series[i - 1] ? cssVar("--good") : cssVar("--critical");
  });

  const abrirPeriodo = (idx) => {
    const p = periods[idx];
    const keySet = new Set(p.monthKeys);
    showMovimentacoesGenerico((m) => keySet.has(monthKey(m.data)), "Movimentações — " + p.label);
  };

  state.charts.invPatrimonio = new Chart(ctx, {
    type: "bar",
    data: {
      labels: periods.map((p) => p.shortLabel),
      datasets: [{ data: series, backgroundColor: colors, borderRadius: 4, maxBarThickness: 30 }],
    },
    options: Object.assign({}, chartBaseOptions({ legend: false }), {
      plugins: { legend: { display: false }, tooltip: tooltipStyle((c) => formatBRL(c.raw)) },
      onClick: (evt, _els, chart) => {
        const points = chart.getElementsAtEventForMode(evt, "nearest", { intersect: true }, true);
        if (points.length) abrirPeriodo(points[0].index);
      },
      onHover: pointerCursorOnHover,
    }),
  });
  state.charts.invPatrimonio.canvas.addEventListener("dblclick", (evt) => {
    const points = state.charts.invPatrimonio.getElementsAtEventForMode(evt, "nearest", { intersect: true }, true);
    if (points.length) abrirPeriodo(points[0].index);
  });
}

// gráfico 2: aportes, rendimentos e retiradas lado a lado em cada período da
// janela, pra comparar a composição de um período com a dos anteriores.
function drawAportesRendRetChart(periods, porPeriodo) {
  destroyChart("invAportesRendRet");
  const ctx = document.getElementById("chart-inv-aportes-rend-ret");
  if (!ctx) return;
  const TIPOS = ["aporte", "rendimento", "retirada"];
  const CORES = [cssVar("--good"), cssVar("--series-1"), cssVar("--critical")];
  const LABELS = { aporte: "Aportes", rendimento: "Rendimentos", retirada: "Retiradas" };

  const abrirTipoPeriodo = (datasetIndex, index) => {
    const p = periods[index];
    const tipo = TIPOS[datasetIndex];
    const keySet = new Set(p.monthKeys);
    showMovimentacoesGenerico((m) => keySet.has(monthKey(m.data)) && m.tipo === tipo, LABELS[tipo] + " — " + p.label);
  };

  state.charts.invAportesRendRet = new Chart(ctx, {
    type: "bar",
    data: {
      labels: periods.map((p) => p.shortLabel),
      datasets: TIPOS.map((tipo, i) => ({
        label: LABELS[tipo], data: porPeriodo.map((x) => x[tipo]), backgroundColor: CORES[i], borderRadius: 4, maxBarThickness: 14,
      })),
    },
    options: Object.assign({}, chartBaseOptions({ legend: true }), {
      onClick: (evt, _els, chart) => {
        const points = chart.getElementsAtEventForMode(evt, "nearest", { intersect: true }, true);
        if (points.length) abrirTipoPeriodo(points[0].datasetIndex, points[0].index);
      },
      onHover: pointerCursorOnHover,
    }),
  });
  state.charts.invAportesRendRet.canvas.addEventListener("dblclick", (evt) => {
    const points = state.charts.invAportesRendRet.getElementsAtEventForMode(evt, "nearest", { intersect: true }, true);
    if (points.length) abrirTipoPeriodo(points[0].datasetIndex, points[0].index);
  });
}

  root.querySelectorAll('[data-act="add-micro"]').forEach((chip) => {

  return {
    label: "É uma compra parcelada?",

  };
}

function wireManualForm(prefill) {
  const macroSel = document.getElementById("f-macro");
  const microSel = document.getElementById("f-micro");
  function fillMicro(selectedMicro) {
    const macro = macroSel.value;
    const micros = state.categorias.filter((c) => c.macrocategoria === macro && c.microcategoria);
    microSel.innerHTML = micros.map((c) => `<option value="${escapeHTML(c.microcategoria)}" ${c.microcategoria===selectedMicro?"selected":""}>${escapeHTML(c.microcategoria)}</option>`).join("") + `<option value="__new__">+ Nova microcategoria…</option>`;
  }
  function applyTipoFilter(tipo) {
    const allMacros = distinctMacros();
    const opts = tipo === "receita" ? allMacros.filter((m) => m === "Receita") : allMacros.filter((m) => m !== "Receita");
    macroSel.innerHTML = opts.map((m) => `<option value="${escapeHTML(m)}">${escapeHTML(m)}</option>`).join("") + `<option value="__new__">+ Nova macrocategoria…</option>`;
    if (prefill && prefill.macrocategoria && opts.includes(prefill.macrocategoria)) macroSel.value = prefill.macrocategoria;
    fillMicro(prefill ? prefill.microcategoria : null);
  }
  document.querySelectorAll("#tipo-toggle button").forEach((b) => {

  });
  applyTipoFilter((prefill && prefill.tipo) || "despesa");

  macroSel.addEventListener("change", async () => {
    if (macroSel.value === "__new__") {
      const name = prompt("Nome da nova macrocategoria:");
      if (name) { await apiCreate("Categorias", { macrocategoria: name, microcategoria: "", ativa: true }); await refreshData(); applyTipoFilter(document.querySelector("#tipo-toggle button.active").dataset.tipo); macroSel.value = name; fillMicro(); }
      else { macroSel.selectedIndex = 0; }
      return;

    fillMicro();
  });
  microSel.addEventListener("change", async () => {
    if (microSel.value === "__new__") {
      const name = prompt(`Nova microcategoria em "${macroSel.value}":`);
      if (name) { await apiCreate("Categorias", { macrocategoria: macroSel.value, microcategoria: name, ativa: true }); await refreshData(); fillMicro(name); }
      else { microSel.selectedIndex = 0; }
